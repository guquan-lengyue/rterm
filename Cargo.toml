[workspace]
resolver = "2"
members = [
    "crates/rterm-app",
    "crates/rterm-session",
    "crates/rterm-ssh",
    "crates/rterm-terminal",
    "crates/rterm-sftp",
    "crates/rterm-monitor",
    "crates/rterm-sync",
    "crates/rterm-crypto",
    "crates/rterm-forward",
]

[workspace.package]
version = "0.2.2"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
# GPUI — bezel fork, the actively-maintained independent fork of Zed's gpui that builds on Windows
gpui          = { package = "bezel-gpui",          version = "0.3" }
gpui_platform = { package = "bezel-gpui-platform", version = "0.3" }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# SSH
ssh2 = { version = "0.9", default-features = false, features = ["vendored-openssl", "openssl-on-win32"] }

# Terminal emulation
alacritty_terminal = "0.25"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors
anyhow = "1"
thiserror = "1"

# Misc
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
bytes = "1"
base64 = "0.22"
# 原生文件选择器（Sprint 4 导入导出）
rfd = "0.16"

# Internal crates
rterm-session  = { path = "crates/rterm-session" }
rterm-ssh      = { path = "crates/rterm-ssh" }
rterm-terminal = { path = "crates/rterm-terminal" }
rterm-sftp     = { path = "crates/rterm-sftp" }
rterm-monitor  = { path = "crates/rterm-monitor" }
rterm-sync     = { path = "crates/rterm-sync" }
rterm-crypto   = { path = "crates/rterm-crypto" }
rterm-forward  = { path = "crates/rterm-forward" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
