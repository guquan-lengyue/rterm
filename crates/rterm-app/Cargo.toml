[package]
name = "rterm-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
build = "build.rs"

[build-dependencies]
embed-resource = "3"

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
futures.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
rterm-crypto.workspace = true
rterm-session.workspace = true
rterm-ssh.workspace = true
rterm-terminal.workspace = true
rterm-sftp = { path = "../rterm-sftp" }
rterm-sync = { path = "../rterm-sync" }
rterm-monitor.workspace = true
rterm-forward.workspace = true
alacritty_terminal.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
dirs = "5"
rfd.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }

# 单实例锁：命名互斥体 + MessageBox 提示
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# Linux：gpui_platform 默认不启用任何窗口后端，必须显式选择 X11 / Wayland
[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { workspace = true, features = ["x11", "wayland"] }
